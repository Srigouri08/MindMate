<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindMate</title>
    <style>
      .brand-icon span,.login-heart span{display:none!important}.brand-icon b{position:static!important;font-size:34px!important;line-height:1!important;color:#7655d3!important}.login-heart{color:#7655d3!important;font-size:34px!important}
      .mm-toolbar{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:9997;display:flex;flex-direction:column;gap:7px;padding:8px;background:rgba(255,255,255,.94);border:1px solid #ded2f5;border-radius:18px;box-shadow:0 12px 35px rgba(70,45,120,.18);backdrop-filter:blur(10px)}
      .mm-tool{width:43px;height:43px;border:0;border-radius:13px;background:#f1eaff;color:#6045a0;font-size:20px;cursor:pointer;transition:.18s}.mm-tool:hover{background:#dfd0ff;transform:scale(1.06)}.mm-tool.add{background:#7655d3;color:#fff}
      .mm-panel{position:fixed;right:78px;top:50%;transform:translateY(-50%);width:330px;max-height:82vh;overflow:auto;z-index:9999;padding:20px;border:1px solid #ddd0f5;border-radius:22px;background:#fffafc;box-shadow:0 22px 55px rgba(50,30,100,.25);font-family:Arial,sans-serif;color:#46366c}.mm-panel h3{margin:0 0 6px}.mm-panel p{margin:0 0 15px;color:#887b9d;font-size:12px}.mm-close{float:right;border:0;background:transparent;font-size:22px;color:#81748f;cursor:pointer}.mm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mm-choice{border:1px solid #ded4ef;border-radius:13px;padding:11px 8px;background:#fff;cursor:pointer;color:#594582;font-weight:600}.mm-choice:hover,.mm-choice.active{background:#eadfff;border-color:#7655d3}.mm-input{width:100%;padding:11px;border:1px solid #ddd3ed;border-radius:11px;background:#fff;margin-top:9px;box-sizing:border-box}.mm-primary{width:100%;margin-top:12px;border:0;border-radius:12px;padding:11px;background:#7655d3;color:#fff;font-weight:700;cursor:pointer}
      .mm-photo{position:absolute;z-index:24;width:150px;padding:8px 8px 28px;background:#fff;box-shadow:0 10px 24px rgba(55,40,85,.2);cursor:grab;user-select:none}.mm-photo img{display:block;width:100%;height:115px;object-fit:cover;pointer-events:none}.mm-photo.polaroid{padding-bottom:32px}.mm-photo.rounded{border-radius:16px;overflow:hidden;padding:5px 5px 10px}.mm-photo.rounded img{border-radius:12px}.mm-photo.film{background:#292334;padding:7px;border:5px solid #292334}.mm-photo.film img{height:105px}.mm-photo.tape:before{content:"";position:absolute;top:-9px;left:42px;width:65px;height:18px;background:rgba(247,220,168,.75);transform:rotate(-2deg)}.mm-photo.heart{border-radius:22px;padding:5px}.mm-photo.heart img{border-radius:17px}.mm-caption{position:absolute;bottom:5px;left:8px;right:8px;text-align:center;font:11px Arial;color:#7c7087;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .mm-memory-overlay{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:rgba(35,25,55,.72);padding:25px}.mm-memory{width:min(760px,94vw);max-height:90vh;overflow:auto;border-radius:24px;background:#fffaf4;padding:25px;box-shadow:0 25px 70px rgba(20,10,45,.4);text-align:center}.mm-memory h2{margin:0 0 5px;color:#493875}.mm-memory-sub{color:#85789a;margin:0 0 18px}.mm-slide{min-height:390px;display:grid;place-items:center;background:linear-gradient(135deg,#f4edff,#fff6f0);border-radius:18px;padding:20px}.mm-slide img{max-width:90%;max-height:430px;border:10px solid #fff;box-shadow:0 12px 28px rgba(60,40,90,.2)}.mm-memory-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}.mm-memory-controls button{border:0;border-radius:12px;padding:10px 15px;background:#e8ddff;color:#503b80;font-weight:700;cursor:pointer}.mm-memory-controls .close{background:#7655d3;color:#fff}
      .mm-template-card{min-height:85px;border-radius:14px;padding:12px;text-align:left;cursor:pointer;border:1px solid #ddd3ee}.mm-template-card strong{display:block;margin-bottom:5px}.mm-template-card small{color:#81748f}.mm-floral{background:linear-gradient(135deg,#fff1f7,#f5edff)}.mm-dreamy{background:linear-gradient(135deg,#eaf4ff,#f8edff)}.mm-nature{background:linear-gradient(135deg,#edf9ef,#fffbea)}.mm-night{background:linear-gradient(135deg,#292544,#4a3c69);color:#fff}.mm-minimal{background:#fff}.mm-cute{background:linear-gradient(135deg,#fff0f5,#fff9e9)}
      .mm-doodle{position:fixed;inset:0;z-index:10001;pointer-events:none}.mm-doodle canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:auto;cursor:crosshair}.mm-doodle-bar{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:2;display:flex;gap:7px;padding:8px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(40,25,80,.2);pointer-events:auto}.mm-doodle-bar button{border:0;border-radius:9px;padding:8px 11px;background:#eee7fb;color:#533d82;font-weight:700;cursor:pointer}.mm-doodle-bar .done{background:#7655d3;color:#fff}
      @media(max-width:800px){.mm-toolbar{right:8px}.mm-panel{right:58px;width:285px}.mm-tool{width:39px;height:39px}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      document.addEventListener("click",function(e){const brand=e.target.closest(".brand");if(!brand)return;const b=[...document.querySelectorAll("button")].find(x=>x.textContent.trim().toLowerCase().includes("new journal"));if(b)b.click()});
      (()=>{
        const KEY="mindmate-little-moments";let photos=[];try{photos=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{}let frame="polaroid",panel=null,timer=null,slideIndex=0,toolbar=null;
        const save=()=>localStorage.setItem(KEY,JSON.stringify(photos)),monthName=(d=new Date())=>d.toLocaleString("en-IN",{month:"long",year:"numeric"}),book=()=>document.querySelector(".book-page");
        const closePanel=()=>{if(panel){panel.remove();panel=null}};
        function openPanel(type){closePanel();panel=document.createElement("div");panel.className="mm-panel";document.body.appendChild(panel);const close='<button class="mm-close">×</button>';
          if(type==="add"){panel.innerHTML=close+'<h3>📸 Add a Little Moment</h3><p>Choose a frame, add photos and an optional caption.</p><div class="mm-grid"><button class="mm-choice active" data-f="polaroid">📷 Polaroid</button><button class="mm-choice" data-f="rounded">🔲 Rounded</button><button class="mm-choice" data-f="film">🎞️ Film</button><button class="mm-choice" data-f="tape">📎 Tape</button><button class="mm-choice" data-f="heart">💜 Heart</button></div><input class="mm-input" id="mm-file" type="file" accept="image/*" multiple><input class="mm-input" id="mm-caption" placeholder="Optional caption..."><button class="mm-primary" id="mm-add">Add Photo(s)</button>';panel.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{frame=b.dataset.f;panel.querySelectorAll("[data-f]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});panel.querySelector("#mm-add").onclick=()=>{const files=[...panel.querySelector("#mm-file").files],caption=panel.querySelector("#mm-caption").value.trim();if(!files.length)return;files.forEach(f=>addPhoto(f,caption));closePanel()};
          }else if(type==="template"){panel.innerHTML=close+'<h3>🎨 Page Templates</h3><p>Choose a look without changing your writing.</p><div class="mm-grid"><button class="mm-template-card mm-floral" data-t="floral"><strong>🌸 Soft Floral</strong><small>Gentle and pretty</small></button><button class="mm-template-card mm-dreamy" data-t="dreamy"><strong>☁️ Dreamy</strong><small>Soft pastel</small></button><button class="mm-template-card mm-nature" data-t="nature"><strong>🌿 Nature</strong><small>Fresh and calm</small></button><button class="mm-template-card mm-night" data-t="night"><strong>🌙 Night Thoughts</strong><small>Moody and cozy</small></button><button class="mm-template-card mm-cute" data-t="cute"><strong>🎀 Cute</strong><small>Playful scrapbook</small></button><button class="mm-template-card mm-minimal" data-t="minimal"><strong>🤍 Minimal</strong><small>Clean and simple</small></button></div>';panel.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>applyTemplate(b.dataset.t));
          }else if(type==="sticker"){panel.innerHTML=close+'<h3>✨ Stickers</h3><p>Use your existing MindMate sticker picker from the journal.</p><button class="mm-primary" id="mm-sticker">Open Sticker Picker</button>';panel.querySelector("#mm-sticker").onclick=()=>{closePanel();const b=[...document.querySelectorAll("button")].find(x=>x.textContent.toLowerCase().includes("sticker"));if(b)b.click()}}
          panel.querySelector(".mm-close").onclick=closePanel;
        }
        function applyTemplate(t){const b=book();if(!b)return;const m={floral:["#fff8fc","#f1dff0"],dreamy:["#f8f5ff","#dcecff"],nature:["#fbfff7","#dcefdc"],night:["#302a49","#675c86"],cute:["#fff7f5","#f2d7e4"],minimal:["#fff","#e4e0e8"]};const [bg,border]=m[t]||m.minimal;b.style.background=bg;b.style.borderColor=border;closePanel()}
        function addPhoto(file,caption){const r=new FileReader();r.onload=()=>{const d=new Date(),item={id:Date.now()+Math.random(),src:r.result,frame,caption,month:monthName(d),x:12+(photos.length%4)*18,y:12+(photos.length%3)*20,createdAt:Date.now()};photos.push(item);save();renderPhoto(item)};r.readAsDataURL(file)}
        function renderPhoto(item){const b=book();if(!b)return;const old=b.querySelector(`[data-mm-id="${item.id}"]`);if(old)old.remove();const w=document.createElement("div");w.className=`mm-photo ${item.frame}`;w.dataset.mmId=item.id;w.style.left=item.x+"%";w.style.top=item.y+"%";w.innerHTML=`<img src="${item.src}" alt="Little moment"><span class="mm-caption">${item.caption||""}</span>`;let drag=null;w.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,l:parseFloat(w.style.left),t:parseFloat(w.style.top)};w.setPointerCapture?.(e.pointerId);e.stopPropagation()};w.onpointermove=e=>{if(!drag)return;const r=b.getBoundingClientRect();w.style.left=Math.max(2,Math.min(82,drag.l+(e.clientX-drag.x)/r.width*100))+"%";w.style.top=Math.max(4,Math.min(78,drag.t+(e.clientY-drag.y)/r.height*100))+"%"};w.onpointerup=()=>{if(drag){item.x=parseFloat(w.style.left);item.y=parseFloat(w.style.top);save();drag=null}};w.ondblclick=()=>{photos=photos.filter(p=>p.id!==item.id);save();w.remove()};b.appendChild(w)}
        function renderAll(){photos.forEach(renderPhoto)}
        function openMemory(){const list=photos.filter(p=>p.month===monthName()),o=document.createElement("div");o.className="mm-memory-overlay";o.innerHTML=`<div class="mm-memory"><h2>✨ ${monthName()} Little Moments</h2><p class="mm-memory-sub">${list.length?list.length+" photos collected this month":"Add photos to start your memory."}</p><div class="mm-slide"></div><div class="mm-memory-controls"><button class="prev">‹</button><button class="play">▶ Play Slideshow</button><button class="next">›</button><button class="close">Close</button></div></div>`;document.body.appendChild(o);const s=o.querySelector(".mm-slide"),play=o.querySelector(".play"),show=()=>{if(!list.length){s.innerHTML="<div style='font-size:60px'>📸</div>";return}const p=list[slideIndex%list.length];s.innerHTML=`<div><img src="${p.src}" alt="Memory"><div style="margin-top:10px;color:#756986">${p.caption||"A little moment worth remembering."}</div></div>`};const next=()=>{if(list.length){slideIndex=(slideIndex+1)%list.length;show()}};o.querySelector(".next").onclick=next;o.querySelector(".prev").onclick=()=>{if(list.length){slideIndex=(slideIndex-1+list.length)%list.length;show()}};play.onclick=()=>{if(!list.length)return;if(timer){clearInterval(timer);timer=null;play.textContent="▶ Play Slideshow"}else{play.textContent="⏸ Pause Slideshow";timer=setInterval(next,2500)}};o.querySelector(".close").onclick=()=>{clearInterval(timer);timer=null;o.remove()};slideIndex=0;show()}
        function openDoodle(){const o=document.createElement("div");o.className="mm-doodle";o.innerHTML='<canvas></canvas><div class="mm-doodle-bar"><button class="undo">↶ Undo</button><button class="clear">Clear</button><button class="done">Done</button></div>';document.body.appendChild(o);const c=o.querySelector("canvas"),ctx=c.getContext("2d"),dpr=devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.scale(dpr,dpr);ctx.lineWidth=3;ctx.lineCap="round";ctx.strokeStyle="#7655d3";let drawing=false,history=[];c.onpointerdown=e=>{drawing=true;history.push(ctx.getImageData(0,0,c.width,c.height));ctx.beginPath();ctx.moveTo(e.clientX,e.clientY)};c.onpointermove=e=>{if(!drawing)return;ctx.lineTo(e.clientX,e.clientY);ctx.stroke()};c.onpointerup=()=>drawing=false;o.querySelector(".undo").onclick=()=>{const h=history.pop();if(h)ctx.putImageData(h,0,0)};o.querySelector(".clear").onclick=()=>ctx.clearRect(0,0,innerWidth,innerHeight);o.querySelector(".done").onclick=()=>o.remove()}
        function makeToolbar(){if(toolbar)return;toolbar=document.createElement("div");toolbar.className="mm-toolbar";toolbar.innerHTML='<button class="mm-tool add" title="Add photo">📸</button><button class="mm-tool" title="Stickers">✨</button><button class="mm-tool" title="Page templates">🎨</button><button class="mm-tool" title="Doodle">✏️</button><button class="mm-tool" title="Little Moments">💫</button>';document.body.appendChild(toolbar);const [p,s,t,d,m]=toolbar.children;p.onclick=()=>openPanel("add");s.onclick=()=>openPanel("sticker");t.onclick=()=>openPanel("template");d.onclick=openDoodle;m.onclick=openMemory}
        let lastBook=null;setInterval(()=>{makeToolbar();const b=book();if(b&&b!==lastBook){lastBook=b;setTimeout(renderAll,80)}},800);setTimeout(()=>{makeToolbar();renderAll()},600);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
